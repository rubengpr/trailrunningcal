interface:
  display_name: "Prepare Brand Outreach"
  short_description: "Research and draft initial or follow-up outreach"
  default_prompt: "Use $prepare-brand-outreach to prepare a brand's initial outreach or decide whether an existing lead needs a personalized Gmail follow-up draft."

dependencies:
  tools:
    - type: "mcp"
      value: "prospeo"
      description: "Primary provider for verified professional email enrichment"
      transport: "streamable_http"
      url: "https://mcp.prospeo.io"
    - type: "mcp"
      value: "hunter"
      description: "Fallback provider for professional email finding and verification"
      transport: "streamable_http"
      url: "https://mcp.hunter.io/mcp"
