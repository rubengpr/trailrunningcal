interface:
  display_name: "Prepare Brand Outreach"
  short_description: "Draft initial and daily follow-up outreach"
  default_prompt: "Use $prepare-brand-outreach to prepare initial outreach for one brand or run the daily follow-up review and create eligible Gmail drafts."

dependencies:
  tools:
    - type: "mcp"
      value: "prospeo"
      description: "Primary provider for verified professional email enrichment"
      transport: "streamable_http"
      url: "https://mcp.prospeo.io"
    - type: "mcp"
      value: "hunter"
      description: "Fallback provider for professional email finding and verification"
      transport: "streamable_http"
      url: "https://mcp.hunter.io/mcp"
